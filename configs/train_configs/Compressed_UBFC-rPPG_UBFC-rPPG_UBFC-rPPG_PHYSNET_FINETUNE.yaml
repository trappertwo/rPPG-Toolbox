BASE: ['']
TOOLBOX_MODE: "train_and_test" # "train_and_test"  or "only_test"
TRAIN:
  BATCH_SIZE: 1
  EPOCHS: 10          # Fewer epochs needed for finetuning
  LR: 1e-4       # was 9e-3
  MODEL_FILE_NAME: UBFC_UBFC_UBFC_physnet_stan
  PLOT_LOSSES_AND_LR: True
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True          # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/content/drive/MyDrive/research_project/data/UBFC-rPPG/train_fold"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/content/drive/MyDrive/research_project/data/UBFC-rPPG/train_fold_preprocess"    # Processed dataset save path, need to be updated
    FILE_LIST_PATH: "/content/drive/MyDrive/research_project/data/UBFC-rPPG/train_fold_preprocess/DataFileLists1/" 
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 0.8
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized'] #if use physnet, should be DiffNormalized, Raw if using SwinIR
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128  #only support for factor of 512
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, RF for RetinaFace
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 32
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 64     # SwinIR pretrained model uses 126X126 frames
        W: 64
VALID:
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True               # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/content/drive/MyDrive/research_project/data/UBFC-rPPG/train_fold"                      # Raw dataset path, need to be updated
    CACHED_PATH: "/content/drive/MyDrive/research_project/data/UBFC-rPPG/train_fold_preprocess"    # Processed dataset save path, need to be updated
    FILE_LIST_PATH: "/content/drive/MyDrive/research_project/data/UBFC-rPPG/train_fold_preprocess/DataFileLists2/"    # Path to store file lists, needs to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.8
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized'] #if use physnet, should be DiffNormalized
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128  #only support for factor of 512
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, RF for RetinaFace
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 32
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 64
        W: 64
TEST:
  OUTPUT_SAVE_DIR: "/content/drive/MyDrive/research_project/runs/exp/output"
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: False                   # to use provided validation dataset to find the best epoch, should be false
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True                  # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/content/drive/MyDrive/research_project/data/UBFC-rPPG/test_fold"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/content/drive/MyDrive/research_project/data/UBFC-rPPG/test_fold_preprocess"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    PREPROCESS :
      DATA_TYPE: ['DiffNormalized']         #if use physnet, should be DiffNormalized
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128                 #only support for factor of 512
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, RF for RetinaFace
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 32
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 64
        W: 64
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: /content/drive/MyDrive/research_project/runs/exp/no_restore_200
MODEL:
  DROP_RATE: 0.1
  NAME: Physnet
  PHYSNET:
    FRAME_NUM: 128
    DO_RESTORE: False
    USE_SWINPHYS: True
    SWINIR_MODEL_PATH: ''
    FREEZE_SWINIR: True
    FREEZE_PHYSNET: False
    SWINPHYS_DIFF_NORMALIZE: False
    SWIN_MODEL_TYPE: ''
INFERENCE:
  BATCH_SIZE: 1
  EVALUATION_METHOD: "FFT"        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 10        # In seconds
  MODEL_PATH: "./final_model_release/PURE_PhysNet_DiffNormalized.pth"
